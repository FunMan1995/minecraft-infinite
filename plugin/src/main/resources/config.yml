# Minecraft Infinite — stack topology
#
# Horizontal (Minecraft X and Z): same dimension, one seed up/down.
#   +X / +Z  →  −X / −Z of seed+1
#   −X / −Z  →  +X / +Z of seed−1
# Vertical (Minecraft Y): through the dimension column of the stack.
#   End sits on the Overworld (bedrock, see-through).
#   Overworld ↔ Nether is the only physical break (black). Use nether portals.
#   Nether floor → End of seed−1 (see-through).
#
# Each seed is a separate world whose coordinates stay inside the float32-safe
# box computed below, so Bedrock/Geyser and Java camera jitter stay functional.

# Smallest movement we still want at the rim. float32 ulp must stay ≤ this.
# 0.0625 = 1/16 block. Do not raise this if Bedrock clients should stay accurate.
min-precision-blocks: 0.0625

# Extra chunks past the playable rim so see-through can stream the next seed.
# Playable half-extent = functionalMax − (overhang-chunks × 16), aligned to nether-scale.
overhang-chunks: 16

# Vanilla portal scale. Nether playable half-extent = overworld / nether-scale.
nether-scale: 8

# auto = largest half-extent that still satisfies min-precision at the rim.
# Set an integer to force a smaller test world (must be divisible by nether-scale).
border-half: auto

# auto = overworld world's seed. Integer = pin the stack origin seed.
base-seed: auto

# Hardcore hearts / mobs. Deaths still respawn at seed 0; items go to a grave.
hardcore: true

# Factions-style combat tag. /home /sethome /tpa /wild are blocked while tagged.
combat-tag-seconds: 15

tpa-timeout-seconds: 60
max-homes: 1

# /wild from seed 0 spawn picks a random seed index in [-range, range] except 0.
wild-seed-range: 64

# Master reincarnate wait (wall clock, ticks while offline). Locked substrate rule.
# Subs may shorten this only for deaths on their own claimed seeds. Deaths on
# master blocks, or visitors who transferred in from master, always use this.
reincarnate-timeout-seconds: 86400

# Seed 0 is the hub: one vanilla save at folder "0" containing Overworld,
# Nether, and End. No PvP, full saturation, no build/edit except operators
# (infinite.hub.edit). Other seeds are the same layout under "<index>/".

# Client-mod fetch for crossing into a sub or kit seed.
kit-http-port: 25580
kit-public-host: 127.0.0.1

# Forced public. When a kit generates a world, these names (or substrings)
# apply to that world. They cannot be marked private.
integral-client-mods:
  - infinite-client.jar
