# Seeded Paper Java server properties. scripts/start.sh refreshes
# port, motd, max-players, view-distance, online-mode from .env.
motd=Minecraft Infinite
server-port=25565
server-ip=
max-players=20
online-mode=true
view-distance=8
simulation-distance=6
spawn-protection=16
difficulty=easy
gamemode=survival
hardcore=false
pvp=true
enable-command-block=false
enable-status=true
hide-online-players=false
enforce-whitelist=false
white-list=false
enforce-secure-profile=true
network-compression-threshold=256
use-native-transport=true
sync-chunk-writes=false
max-tick-time=60000
max-world-size=29999984
spawn-monsters=true
spawn-npcs=true
spawn-animals=true
allow-nether=true
allow-flight=false
enable-query=false
enable-rcon=false
broadcast-console-to-ops=true
broadcast-rcon-to-ops=true
function-permission-level=2
op-permission-level=4
player-idle-timeout=0
rate-limit=0
log-ips=true
accepts-transfers=false
